- name: HIGH | AZLX-23-001270 | PATCH | Amazon Linux 2023 must implement a FIPS 140-2/140-3 compliant systemwide cryptographic policy.
  when: az2023stig_001270
  tags:
    - azlx-23-001270
    - CAT1
    - SV-283452r1188500_rule
    - V-283452
    - SRG-OS-000120-GPOS-00061
    - SRG-OS-000396-GPOS-00176
    - SRG-OS-000393-GPOS-00173
    - SRG-OS-000394-GPOS-00174
    - SRG-OS-000424-GPOS-00188
    - CCI-000803
    - CCI-002450
    - CCI-002890
    - CCI-003123
    - CCI-002421
    - NIST800-53R4_IA-7
    - NIST800-53R4_SC-13
    - NIST800-53R4_MA-4
    - NIST800-53R4_SC-8
    - crypto
    - fips
  block:
    - name: HIGH | AZLX-23-001270 | PATCH | Amazon Linux 2023 must implement a FIPS 140-2/140-3 compliant systemwide cryptographic policy.
      ansible.builtin.template:
        src: etc/crypto-policies/policies/modules/SCOPES-AND-WILDCARDS.pmod.j2
        dest: /etc/crypto-policies/policies/modules/SCOPES-AND-WILDCARDS.pmod
        owner: root
        group: root
        mode: 'go-rwx'

    - name: HIGH | AZLX-23-001270 | PATCH | Amazon Linux 2023 must implement a FIPS 140-2/140-3 compliant systemwide cryptographic policy.
      ansible.builtin.set_fact:
        fips_required: true

- name: HIGH | AZLX-23-001285 | PATCH | Amazon Linux 2023 crypto policy must not be overridden.
  when: az2023stig_001285
  tags:
    - azlx-23-001285
    - CAT1
    - SV-274058r1186176_rule
    - V-274058
    - SRG-OS-000396-GPOS-00176
    - SRG-OS-000393-GPOS-00173
    - SRG-OS-000394-GPOS-00174
    - SRG-OS-000424-GPOS-00188
    - SRG-OS-000073-GPOS-00041
    - SRG-OS-000120-GPOS-00061
    - CCI-002450
    - CCI-002890
    - CCI-003123
    - CCI-002421
    - CCI-000803
    - NIST800-53R4_IA-7
    - NIST800-53R4_SC-13
    - NIST800-53R4_MA-4
    - NIST800-53R4_SC-8
    - crypto
    - fips
  block:
    - name: HIGH | AZLX-23-001285 | AUDIT | Amazon Linux 2023 crypto policy must not be overridden.
      ansible.builtin.find:
        paths: /usr/share/crypto-policies/FIPS
        patterns: "*.txt"
        excludes: "nss.txt"
      register: discovered_fips_policies_files

    - name: HIGH | AZLX-23-001285 | PATCH | Amazon Linux 2023 crypto policy must not be overridden.
      ansible.builtin.file:
        src: "{{ item.path }}"
        dest: "/etc/crypto-policies/back-ends/{{ item.path | basename | regex_replace('\\.txt$', '.config') }}"
        state: link
        force: true
      loop: "{{ discovered_fips_policies_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

- name: HIGH | AZLX-23-001286 | PATCH | Amazon Linux 2023 must implement DOD-approved encryption in the bind package.
  when:
    - az2023stig_001286
    - "'bind' in ansible_facts['packages']"
  tags:
    - azlx-23-001286
    - CAT1
    - SV-283440r1192648_rule
    - V-283440
    - SRG-OS-000423-GPOS-00187
    - CCI-002418
    - NIST800-53R4_SC-8
    - crypto
    - bind
  ansible.builtin.lineinfile:
    path: /etc/named.conf
    regexp: ^include "/etc/crypto-policies/back-ends/bind.config"
    line: 'include "/etc/crypto-policies/back-ends/bind.config";'
    insertafter: 'options'
