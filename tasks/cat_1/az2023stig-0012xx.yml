---

- name: HIGH | AZLX-23-001225 | PATCH | Amazon Linux 2023 must force a frequent session key renegotiation for SSH connections to the server.
  when: az2023stig_001225
  tags:
    - azlx-23-001225
    - CAT1
    - SV-274046r1120126_rule
    - V-274046
    - SRG-OS-000423-GPOS-00187
    - SRG-OS-000033-GPOS-00014
    - SRG-OS-000424-GPOS-00188
    - NIST800-53R4_SC-8
    - NIST800-53_AC-17
    - CCI-002418
    - CCI-000068
    - CCI-002421
    - ssh
  block:
    - name: HIGH | AZLX-23-001225 | AUDIT | Amazon Linux 2023 must force a frequent session key renegotiation for SSH connections to the server.
      ansible.builtin.find:
        paths: /etc/sshd_config.d/
        contains: ^RekeyLimit (?!1G 1h).*
      register: discovered_ssh_rekey

    - name: HIGH | AZLX-23-001225 | PATCH | Amazon Linux 2023 must force a frequent session key renegotiation for SSH connections to the server.
      ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: (^RekeyLimit.*)
        replace: '#\1'
        validate: sshd -t -f %s
      loop: "{{ discovered_ssh_rekey.files }}"
      loop_control:
        label: "{{ item.path }}"
      notify: Restart ssh

    - name: HIGH | AZLX-23-001225 | PATCH | Amazon Linux 2023 must force a frequent session key renegotiation for SSH connections to the server.
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: ^RekeyLimit (?!1G 1h)
        line: RekeyLimit 1G 1h
        validate: sshd -t -f %s
      notify: Restart ssh

- name: HIGH | AZLX-23-001255 | PATCH | Amazon Linux 2023 must enable the Pluggable Authentication Module (PAM) interface for SSHD.
  when: az2023stig_001255
  tags:
    - azlx-23-001255
    - CAT1
    - SV-274052r1120144_rule
    - V-274052
    - SRG-OS-000125-GPOS-00065
    - NIST800-53R4_MA-4
    - CCI-000877
    - ssh
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: (?i)^(#?)UsePAM (no|false|off)
    line: UsePAM yes
    validate: sshd -t -f %s
    state: present
  notify: Restart ssh

