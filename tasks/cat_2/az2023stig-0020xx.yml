  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: ^(#?)admin_space_left_action\s*=\s*{{ az2023stig_auditd_admin_space_left_action }}.*
    line: admin_space_left_action = {{ az2023stig_auditd_admin_space_left_action }}

- name: MEDIUM | AZLX-23-002055 | PATCH | Amazon Linux 2023 must immediately notify the system administrator (SA) and information system security officer (ISSO), at a minimum, of an audit processing failure event.
  when: az2023stig_002055
  tags:
    - azlx-23-002055
    - CAT2
    - SV-274075r1120700_rule
    - V-274075
    - SRG-OS-000343-GPOS-00134
    - CCI-001855
    - NIST800-53R4_AU-5
    - auditd
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: ^(#?)action_mail_acct\s*=\s*{{ az2023stig_auditd_action_mail_acct }}.*
    line: action_mail_acct = {{ az2023stig_auditd_action_mail_acct }}

- name: MEDIUM | AZLX-23-002060 | PATCH | Amazon Linux 2023 must be configured to off-load audit records onto a different system from the system being audited via syslog.
  when: az2023stig_002060
  tags:
    - azlx-23-002060
    - CAT2
    - SV-274076r1120216_rule
    - V-274076
    - SRG-OS-000479-GPOS-00224
    - CCI-001852
    - NIST800-53R4_AU-4
    - syslog
  ansible.builtin.lineinfile:
    path: /etc/audit/plugins.d/syslog.conf
    regexp: ^(#?)active\s*=\s*>*
    line: active = yes

- name: MEDIUM | AZLX-23-002065 | PATCH | Amazon Linux 2023 must authenticate the remote logging server for off-loading audit logs via rsyslog.
  when: az2023stig_002065
  tags:
    - azlx-23-002065
    - CAT2
    - SV-274077r1120219_rule
    - V-274077
    - SRG-OS-000479-GPOS-00224
    - CCI-001851
    - NIST800-53R4_AU-4
    - syslog
  ansible.builtin.lineinfile:
    path: "{{ az2023stig_rsyslog_offload_conf_file | default('/etc/rsyslog.conf') }}"
    regexp: ^(#?)\$ActionSendStreamDriverAuthMode.*
    line: '$ActionSendStreamDriverAuthMode x509/name'

- name: MEDIUM | AZLX-23-002070 | PATCH | Amazon Linux 2023 must encrypt the transfer of audit records off-loaded onto a different system or media from the system being audited via rsyslog.
  when: az2023stig_002070
  tags:
    - azlx-23-002070
    - CAT2
    - SV-274078r1120222_rule
    - V-274078
    - SRG-OS-000479-GPOS-00224
    - CCI-001851
    - NIST800-53R4_AU-4
    - syslog
  ansible.builtin.lineinfile:
    path: "{{ az2023stig_rsyslog_offload_conf_file | default('/etc/rsyslog.conf') }}"
    regexp: ^(#?)\$ActionSendStreamDriverMode .*
    line: '$ActionSendStreamDriverMode 1'

- name: MEDIUM | AZLX-23-002075 | PATCH | Amazon Linux 2023 must encrypt via the gtls driver the transfer of audit records off-loaded onto a different system or media from the system being audited via rsyslog.
  when: az2023stig_002075
  tags:
    - azlx-23-002075
    - CAT2
    - SV-274079r1120724_rule
    - V-274079
    - SRG-OS-000479-GPOS-00224
    - CCI-001851
    - NIST800-53R4_AU-4
    - syslog
  ansible.builtin.lineinfile:
    path: "{{ az2023stig_rsyslog_offload_conf_file | default('/etc/rsyslog.conf') }}"
    regexp: ^(#?)\$ActionSendStreamDriverMode .*
    line: '$ActionSendStreamDriverMode 1'

