- name: MEDIUM | AZLX-23-002225 | PATCH | Amazon Linux 2023 audit logs must be group-owned by root or by a restricted logging group to prevent unauthorized read access.
  when: az2023stig_002225
  tags:
    - azlx-23-002225
    - CAT2
    - SV-274108r1120312_rule
    - V-274108
    - SRG-OS-000057-GPOS-00027
    - SRG-OS-000058-GPOS-00028
    - SRG-OS-000059-GPOS-00029
    - SRG-OS-000206-GPOS-00084
    - CCI-000162
    - CCI-000163
    - CCI-000164
    - CCI-001314
    - NIST800-53R4_AU-9
    - NIST800-53R4_SI-11
    - auditd
  block:
    - name: MEDIUM | AZLX-23-002225 | AUDIT | Amazon Linux 2023 audit logs must be group-owned by root or by a restricted logging group to prevent unauthorized read access.
      ansible.builtin.shell: grep log_group /etc/audit/auditd.conf | awk '{ print $NF }'
      changed_when: false
      failed_when: discovered_auditd_log_group.rc not in [ 0, 1]
      register: discovered_auditd_log_group

    - name: MEDIUM | AZLX-23-002225 | AUDIT | Amazon Linux 2023 audit logs must be group-owned by root or by a restricted logging group to prevent unauthorized read access.
      ansible.builtin.shell: grep log_file /etc/audit/auditd.conf | awk '{ print $NF }'
      changed_when: false
      failed_when: discovered_auditd_log_file_group_owner.rc not in [ 0, 1]
      register: discovered_auditd_log_file_group_owner

    - name: MEDIUM | AZLX-23-002225 | PATCH | Amazon Linux 2023 audit logs must be group-owned by root or by a restricted logging group to prevent unauthorized read access.
      ansible.builtin.file:
        path: "{{ discovered_auditd_log_file_group_owner.stdout }}"
        state: directory
        group: "{{ discovered_auditd_log_group.stdout | default('root') }}"
        mode: 'u-x,go-wx'

