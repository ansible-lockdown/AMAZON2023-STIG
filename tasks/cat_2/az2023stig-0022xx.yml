    - name: MEDIUM | AZLX-23-002295 | AUDIT | Amazon Linux 2023 library files must be owned by root.
      ansible.builtin.shell: find /lib /lib64 /usr/lib /usr/lib64 -type f -name '*.so*' ! -user root
      changed_when: false
      failed_when: discovered_lib_files_owner.rc not in [ 0, 1]
      register: discovered_lib_files_owner

    - name: MEDIUM | AZLX-23-002295 | PATCH | Amazon Linux 2023 library files must be owned by root.
      ansible.builtin.file:
        path: "{{ item }}"
        owner: root
      loop: "{{ discovered_lib_files_owner.stdout_lines }}"
