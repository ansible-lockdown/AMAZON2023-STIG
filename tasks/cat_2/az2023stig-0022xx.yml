    - CCI-000163
    - CCI-000164
    - CCI-001314
    - NIST800-53R4_AU-9
    - NIST800-53R4_SI-11
  block:
    - name: MEDIUM | AZLX-23-002235 | AUDIT | Amazon Linux 2023 audit logs file must have mode "0600" or less permissive to prevent unauthorized access to the audit log
      ansible.builtin.shell: grep ^log_file /etc/audit/auditd.conf | awk '{ print $NF }'
      changed_when: false
      register: discovered_auditd_logfile_perms

    - name: MEDIUM | AZLX-23-002235 | AUDIT | Amazon Linux 2023 audit logs file must have mode "0600" or less permissive to prevent unauthorized access to the audit log
      ansible.builtin.find:
        paths: "{{ discovered_auditd_logfile_perms.stdout | dirname }}"
        file_type: file
      register: discovered_auditd_logs

    - name: MEDIUM | AZLX-23-002235 | PATCH | Amazon Linux 2023 audit logs file must have mode "0600" or less permissive to prevent unauthorized access to the audit log
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: file
        mode: 'u-x,go-rwx'
      failed_when: discovered_auditd_log_perm_change.state not in [ 'file', 'absent' ]
      register: discovered_auditd_log_perm_change
      loop: "{{ discovered_auditd_logs.files }}"

- name: MEDIUM | AZLX-23-002240 | PATCH | Amazon Linux 2023 must allow only the information system security manager (ISSM) (or individuals or roles appointed by the ISSM) to select which auditable events are to be audited.
