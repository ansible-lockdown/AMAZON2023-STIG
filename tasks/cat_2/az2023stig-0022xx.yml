    - azlx-23-002240
    - CAT2
    - SV-274111r1120321_rule
    - V-274111
    - SRG-OS-000063-GPOS-00032
    - CCI-000171
    - NIST800-53R4_AU-12
  block:
    - name: MEDIUM | AZLX-23-002240 | AUDIT | Amazon Linux 2023 must allow only the information system security manager (ISSM) (or individuals or roles appointed by the ISSM) to select which auditable events are to be audited.
      ansible.builtin.find:
        paths: /etc/audit/rules.d/
        patterns: '*.(conf|rules)'
      register: discovered_auditd_conf_rules

    - name: MEDIUM | AZLX-23-002240 | PATCH | Amazon Linux 2023 must allow only the information system security manager (ISSM) (or individuals or roles appointed by the ISSM) to select which auditable events are to be audited.
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: file
        mode: 'u-x,g-wx,o-rwx'
      failed_when: discovered_auditd_log_perm_change.state not in [ 'file', 'absent' ]
      register: discovered_auditd_conf_rules_change
      loop: "{{ discovered_auditd_conf_rules.files }}"

    - name: MEDIUM | AZLX-23-002240 | PATCH | Amazon Linux 2023 must allow only the information system security manager (ISSM) (or individuals or roles appointed by the ISSM) to select which auditable events are to be audited.
      ansible.builtin.file:
