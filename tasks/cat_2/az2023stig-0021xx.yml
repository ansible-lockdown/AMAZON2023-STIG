    - az2023stig_002190
    - az2023stig_disruption_high
  tags:
    - azlx-23-002190
    - CAT2
    - SV-274101r1120291_rule
    - V-274101
    - SRG-OS-000256-GPOS-00097
    - CCI-001493
    - NIST800-53R4_AU-9
    - permissions
    - auditd
  ansible.builtin.file:
    path: "{{ item }}"
    state: file
    mode: 'go-w'
  failed_when: discovered_audit_tools_file_perms.state not in '[ file, absent ]'
  register: discovered_audit_tools_file_perms
  loop: "{{ az2023stig_audit_tools }}"

