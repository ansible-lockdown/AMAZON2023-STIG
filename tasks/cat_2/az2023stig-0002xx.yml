---

- name: MEDIUM | AZLX-23-000200 | PATCH | Amazon Linux 2023 must restrict access to the kernel message buffer.
  when: az2023stig_000200
  tags:
    - azlx-23-000200
    - CAT2
    - SV-274001r1119991_rule
    - V-274001
    - SRG-OS-000132-GPOS-00067
    - SRG-OS-000138-GPOS-00069
    - NIST800-53R4_SC-2
    - NIST800-53R4_SC-4
    - kernel
    - sysctl
  ansible.posix.sysctl:
    name: kernel.dmesg_restrict
    state: present
    reload: true
    sysctl_file: "{{ az2023stig_sysctl_file_kernel }}"
    sysctl_set: true
    value: '1'

- name: MEDIUM | AZLX-23-000205 | PATCH | Amazon Linux 2023 must prevent kernel profiling by nonprivileged users.
