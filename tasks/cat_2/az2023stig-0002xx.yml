    - CCI-001090
    - NIST800-53R4_SC-2
    - NIST800-53R4_SC-4
    - kernel
    - sysctl
  ansible.posix.sysctl:
    name: kernel.perf_event_paranoid
    state: present
    reload: true
    sysctl_file: "{{ az2023stig_sysctl_file_kernel }}"
    sysctl_set: true
    value: '2'

