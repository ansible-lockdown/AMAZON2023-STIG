---

- name: MEDIUM | AZLX-23-002300 | PATCH | Amazon Linux 2023 library files must be group-owned by root or a system account.
  when: az2023stig_002300
  tags:
    - azlx-23-002300
    - CAT2
    - SV-274123r1120357_rule
    - V-274123
    - SRG-OS-000259-GPOS-00100
    - CCI-001499
    - NIST800-53R4_CM-5
    - permissions
  block:
    - name: MEDIUM | AZLX-23-002300 | AUDIT | Amazon Linux 2023 library files must be group-owned by root or a system account.
      ansible.builtin.shell: find /lib /lib64 /usr/lib /usr/lib64 ! -group root -type f
      changed_when: false
      failed_when: discovered_lib_files_group.rc not in [ 0, 1]
      register: discovered_lib_files_group

    - name: MEDIUM | AZLX-23-002300 | PATCH | Amazon Linux 2023 library files must be group-owned by root or a system account.
      ansible.builtin.file:
        path: "{{ item }}"
        group: root
      loop: "{{ discovered_lib_files_group.stdout_lines }}"

