- name: MEDIUM | AZLX-23-002345 | PATCH | Amazon Linux 2023 system commands must be owned by root.
  when: az2023stig_002345
  tags:
    - azlx-23-002345
    - CAT2
    - SV-274131r1120381_rule
    - V-274131
    - SRG-OS-000259-GPOS-00100
    - CCI-001499
    - NIST800-53R4_CM-5
    - permissions
  block:
    - name: MEDIUM | AZLX-23-002345 | AUDIT | Amazon Linux 2023 system commands must be owned by root.
      ansible.builtin.shell: find -L /bin /sbin /usr/bin /usr/sbin /usr/libexec /usr/local/bin /usr/local/sbin ! -user root -exec ls {} \;
      changed_when: false
      failed_when: discovered_sys_commands_owner.rc not in [ 0, 1 ]
      register: discovered_sys_commands_owner

    - name: MEDIUM | AZLX-23-002345 | PATCH | Amazon Linux 2023 system commands must be owned by root.
      when: discovered_sys_commands_owner.stdout | length > 0
      ansible.builtin.file:
        path: "{{ item }}"
        owner: root
      loop: "{{ discovered_sys_commands_owner.stdout_lines }}"
      loop_control:
        label: "{{ item }}"

- name: MEDIUM | AZLX-23-002350 | PATCH | Amazon Linux 2023 system commands must be group-owned by root or a system account.
  when: az2023stig_002350
  tags:
    - azlx-23-002350
    - CAT2
    - SV-274132r1120384_rule
    - V-274132
    - SRG-OS-000259-GPOS-00100
    - CCI-001499
    - NIST800-53R4_CM-5
    - permissions
  block:
    - name: MEDIUM | AZLX-23-002350 | AUDIT | Amazon Linux 2023 system commands must be group-owned by root or a system account.
      ansible.builtin.shell: find -L /bin /sbin /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin ! \( -group root -o -group tty \) -exec ls -l {} \;
      changed_when: false
      failed_when: discovered_sys_commands_group.rc not in [ 0, 1 ]
      register: discovered_sys_commands_group

    - name: MEDIUM | AZLX-23-002350 | PATCH | Amazon Linux 2023 system commands must be group-owned by root or a system account.
      when:
        - discovered_sys_commands_group.stdout | length > 0
        - "prelim_system_accounts.stdout not in item"
      ansible.builtin.file:
        path: "{{ item }}"
        group: root
      loop: "{{ discovered_sys_commands_group.stdout_lines }}"
      loop_control:
        label: "{{ item }}"
      failed_when: discovered_sys_commands_group_patch.state not in [ 'file', 'absent' ]
      register: discovered_sys_commands_group_patch

- name: MEDIUM | AZLX-23-002355 | PATCH | Amazon Linux 2023 must enforce password complexity by requiring that at least one uppercase character be used.
  when: az2023stig_002355
  tags:
    - azlx-23-002355
    - CAT2
    - SV-274133r1120387_rule
    - V-274133
    - SRG-OS-000069-GPOS-00037
    - NIST800-53R4_NA
    - pam
  block:
    - name: MEDIUM | AZLX-23-002355 | AUDIT | Amazon Linux 2023 must enforce password complexity by requiring that at least one uppercase character be used.
      ansible.builtin.find:
        paths: /etc/security/
        patterns: '*.conf'
        contains: ^(?#)ucredit\s*=\s*(?!-1)(0|-\d)
      changed_when: false
      register: discovered_pwquality_ucredit_conf

    - name: MEDIUM | AZLX-23-002355 | PATCH | Amazon Linux 2023 must enforce password complexity by requiring that at least one uppercase character be used.
      when: discovered_pwquality_ucredit_conf.matched > 0
      ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: ^(?#)ucredit\s*=\s*.*
        replace: 'ucredit = {{ az2023stig_pwquality_ucredit }}'
      loop: "{{ discovered_pwquality_ucredit_conf.files }}"
      loop_control:
        label: "{{ item }}"

    - name: MEDIUM | AZLX-23-002355 | PATCH | Amazon Linux 2023 must enforce password complexity by requiring that at least one uppercase character be used.
      ansible.builtin.lineinfile:
        path: /etc/security/pwquality.conf
        regexp: ^(?#)ucredit\s*=\s*(?!-1)(0|-\d)
        line: 'ucredit = {{ az2023stig_pwquality_ucredit }}'

