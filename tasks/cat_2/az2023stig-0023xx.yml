- name: MEDIUM | AZLX-23-002396 | PATCH | Amazon Linux 2023 must automatically exit interactive command shell user sessions after 15 minutes of inactivity.
  when: az2023stig_002396
  tags:
    - azlx-23-002396
    - CAT2
    - SV-274142r1120414_rule
    - V-274142
    - SRG-OS-000163-GPOS-00072
    - CCI-000057
    - CCI-001133
    - NIST800-53R4_AC-11
    - NIST800-53R4_SC-10
    - pam
  block:
    - name: MEDIUM | AZLX-23-002396 | AUDIT | Amazon Linux 2023 must automatically exit interactive command shell user sessions after 15 minutes of inactivity.
      ansible.builtin.find:
        paths: /etc/profile /etc/profile.d/
        patterns: '*.sh'
        contains: ^(?#)declare -xr TMOUT=(?!([0-9]|[1-9][0-9]|[1-5][0-9][0-9]|600)\d*)
      changed_when: false
      register: discovered_profile_timeout

    - name: MEDIUM | AZLX-23-002396 | PATCH | Amazon Linux 2023 must automatically exit interactive command shell user sessions after 15 minutes of inactivity.
      when: discovered_profile_timeout.matched > 0
      ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: ^(?#)declare
        replace: declare -xr TMOUT={{ az2023_profile_timeout_seconds }}
      loop: "{{ discovered_profile_timeout.files }}"
      loop_control:
        label: "{{ item }}"

    - name: MEDIUM | AZLX-23-002396 | PATCH | Amazon Linux 2023 must automatically exit interactive command shell user sessions after 15 minutes of inactivity.
      when: discovered_profile_timeout.matched > 0
      ansible.builtin.lineinfile:
        path: /etc/security/pwquality.conf
        regexp: ^(?#)declare
        line: declare -xr TMOUT={{ az2023_profile_timeout_seconds }}
        state: present
