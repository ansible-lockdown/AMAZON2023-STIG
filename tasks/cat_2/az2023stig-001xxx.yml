# To add rules prior to starting firewall
- name: MEDIUM | AZLX-23-001085 | PATCH | Amazon Linux 2023 must be configured to disable nonessential capabilities.
  when: az2023stig_001085
  tags:
    - azlx-23-001085
    - CAT2
    - SV-274029r1120075_rule
    - V-274029
    - SRG-OS-000095-GPOS-00049
    - CCI-000381
    - NIST800-53R4_CM-7
  block:
    - name: MEDIUM | AZLX-23-001085 | PATCH | Amazon Linux 2023 must be configured to disable nonessential capabilities. | services
      ansible.posix.firewalld:
        service: "{{ (item == (item | regex_search('^[a-z]+$'))) | bool | ternary(item, omit) }}"
        state: enabled
        permanent: true
        immediate: true
        offline: true
      loop: "{{ az2023_firewalld_service }}"

    - name: MEDIUM | AZLX-23-001085 | PATCH | Amazon Linux 2023 must be configured to disable nonessential capabilities. | ports
      when: az2023_firewalld_ports is defined
      ansible.posix.firewalld:
        port: "{{ (item == (item | regex_search('^[0-9]+/[a-z]+$'))) | bool | ternary(item, omit) }}"
        state: enabled
        permanent: true
        immediate: true
        offline: true
      loop: "{{ az2023_firewalld_ports }}"
      loop_control:
        label: "{{ item.port }}"
      notify: Restart firewalld

- name: MEDIUM | AZLX-23-001090 | PATCH | Amazon Linux 2023 must manage excess capacity, bandwidth, or other redundancy to limit the effects of information flooding types of denial-of-service (DoS) attacks.
