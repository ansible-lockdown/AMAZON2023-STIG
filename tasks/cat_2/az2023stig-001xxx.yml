- name: MEDIUM | AZLX-23-001070 | PATCH | Amazon Linux 2023 must use cryptographic mechanisms to protect the integrity of audit tools.
  when: az2023stig_001070
  tags:
    - azlx-23-001070
    - CAT2
    - SV-274026r1120066_rule
    - V-274026
    - SRG-OS-000256-GPOS-00097
    - SRG-OS-000257-GPOS-00098
    - SRG-OS-000258-GPOS-00099
    - SRG-OS-000278-GPOS-00108
    - CCI-001493
    - CCI-001494
    - CCI-001495
    - CCI-001496
    - NIST800-53R4_AU-9
    - aide
  ansible.builtin.blockinfile:
    path: /etc/aide.conf
    marker: "# {mark} Audit tools - STIG benchmark - Ansible-lockdown"
    block: |
      /usr/sbin/auditctl p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/auditd p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/ausearch p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/aureport p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/autrace p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/augenrules p+i+n+u+g+s+b+acl+xattrs+sha512
    validate: aide -D --config %s

