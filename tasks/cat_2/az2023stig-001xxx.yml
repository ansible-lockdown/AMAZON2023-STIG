- name: MEDIUM | AZLX-23-001000 | PATCH | Amazon Linux 2023 must have the sudo package installed.
  when: az2023stig_001000
  tags:
    - azlx-23-001000
    - CAT2
    - SV-274012r1120710_rule
    - V-274012
    - SRG-OS-000324-GPOS-00125
    - CCI-002235
    - NIST800-53R4_AC-6
    - sudo
  ansible.builtin.package:
    name: sudo
    state: present

- name: MEDIUM | AZLX-23-001005 | PATCH | Amazon Linux 2023 must not be configured to bypass password requirements for privilege escalation.
  when: az2023stig_001005
  tags:
    - azlx-23-001005
    - CAT2
    - SV-274013r1120027_rule
    - V-274013
    - SRG-OS-000312-GPOS-00123
    - CCI-002165
    - NIST800-53R4_AC-3
    - sudo
  ansible.builtin.replace:
    path: /etc/pam.d/sudo
    regexp: ^pam_succeed_if
    replace: ''

- name: MEDIUM | AZLX-23-001010 | PATCH | Amazon Linux 2023 must require reauthentication when using the "sudo" command.
  when:
    - az2023stig_001010
    - az2023stig_disruption_high
  tags:
    - azlx-23-001010
    - CAT2
    - SV-274043r1120030_rule
    - V-274014
    - SRG-OS-000373-GPOS-00157
    - CCI-002038
    - NIST800-53R4_IA-11
    - sudo
  block:

    - name: MEDIUM | AZLX-23-001010 | PATCH | Amazon Linux 2023 must require reauthentication when using the "sudo" command.
      when: prelim_sudoers_files.stdout_lines | length > 0
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: timestamp_timeout\s*=\s*(-\d|0)
        replace: ''
        validate: '/usr/sbin/visudo -cf %s'
      loop: "{{ prelim_sudoers_files.stdout_lines }}"

    - name: MEDIUM | AZLX-23-001010 | PATCH | Amazon Linux 2023 must require reauthentication when using the "sudo" command.
      ansible.builtin.lineinfile:
        path: /etc/sudoers
        regexp: (^Defaults.*)timestamp_timeout\s*=\s*(-\d|0)(.*)
        line: Defaults   timestamp_timeout=1
        insertafter: '# Defaults specification'
        state: present
        validate: '/usr/sbin/visudo -cf %s'

- name: MEDIUM | AZLX-23-001015 | PATCH | Amazon Linux 2023 must require users to reauthenticate for privilege escalation.
  when:
    - az2023stig_001015
    - prelim_sudoers_files.stdout_lines | length > 0
    - az2023stig_disruption_high
  tags:
    - azlx-23-001015
    - CAT2
    - SV-274015r1120033_rule
    - V-274015
    - SRG-OS-000373-GPOS-00156
    - CCI-002038
    - NIST800-53R4_IA-11
    - sudo
  ansible.builtin.replace:
    path: "{{ item }}"
    regexp: '!authenticate'
    replace: ''
    validate: '/usr/sbin/visudo -cf %s'
  loop: "{{ prelim_sudoers_files.stdout_lines }}"

- name: MEDIUM | AZLX-23-001020 | PATCH | Amazon Linux 2023 must require users to provide a password for privilege escalation.
  when:
    - az2023stig_001020
    - prelim_sudoers_files.stdout_lines | length > 0
    - az2023stig_disruption_high
  tags:
    - azlx-23-001020
    - CAT2
    - SV-274016r1120036_rule
    - V-274016
    - SRG-OS-000480-GPOS-00227
    - CCI-000366
    - NIST800-53R4_CM-6
    - sudo
  ansible.builtin.replace:
    path: "{{ item }}"
    regexp: '^((?!#|{% for name in az2023stig_sudoers_exclude_nopasswd_list %}{{ name }}{% if not loop.last -%}|{%- endif -%}{% endfor %}).*)NOPASSWD(.*)'
    replace: ''
    validate: '/usr/sbin/visudo -cf %s'
  loop: "{{ prelim_sudoers_files.stdout_lines }}"

