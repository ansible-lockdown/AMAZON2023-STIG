  when:
    - az2023stig_001310
    - az2023stig_disruption_high
  tags:
    - azlx-23-001310
    - CAT2
    - SV-274063r1120712_rule
    - V-274063
    - SRG-OS-000066-GPOS-00034
    - SRG-OS-000775-GPOS-00230
    - SRG-OS-000384-GPOS-00167
    - SRG-OS-000403-GPOS-00182
    - CCI-000185
    - CCI-002470
    - NIST800_53R4_IA-5
    - NIST800_53R4_SC-23
    - sssd
  vars:
    warn_control_id: "MEDIUM | AZLX-23-001310"
  block:
    - name: MEDIUM | AZLX-23-001310 | AUDIT | Amazon Linux 2023, for PKI-based authentication, must validate certificates by constructing a certification path (which includes status information) to an accepted trust anchor.
      ansible.builtin.command: openssl x509 -text -in /etc/sssd/pki/sssd_auth_ca_db.pem
      changed_when: false
      failed_when: false
      register: discovered_ca_sssd_cert

    - name: MEDIUM | AZLX-23-001310 | AUDIT | Amazon Linux 2023, for PKI-based authentication, must validate certificates by constructing a certification path (which includes status information) to an accepted trust anchor.
      when:
        - discovered_ca_sssd_cert is defined
        - discovered_ca_sssd_cert.stdout | length > 0
        - "'Issuer: C = US, O = U.S. Government, OU = DOD, OU = PKI, CN = DOD Root CA 3' not in discovered_ca_sssd_cert.stdout"
      ansible.builtin.debug:
        msg:
          - "WARNING!! DOD root CA details not found in file /etc/sssd/pki/sssd_auth_ca_db.pem"

    - name: MEDIUM | AZLX-23-001310 | AUDIT | Amazon Linux 2023, for PKI-based authentication, must validate certificates by constructing a certification path (which includes status information) to an accepted trust anchor.
      ansible.builtin.import_tasks:
        file: warning_facts.yml

