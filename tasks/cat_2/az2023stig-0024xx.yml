- name: MEDIUM | AZLX-23-002489 | PATCH | Amazon Linux 2023 must ensure the password complexity module is enabled in the password-auth file.
  when: az2023stig_002489
  tags:
    - azlx-23-002489
    - CAT2
    - SV-274161r1120471_rule
    - V-274161
    - SRG-OS-000069-GPOS-00037
    - CCI-000192
    - CCI-000193
    - NIST800-53R4_IA-5
    - pamd
  vars:
    warn_control_id: "MEDIUM | AZLX-23-002489"
  block:
    - name: MEDIUM | AZLX-23-002489 | AUDIT | Amazon Linux 2023 must ensure the password complexity module is enabled in the password-auth file.
      ansible.builtin.shell: grep "password.*pam_pwquality.so" /etc/pam.d/password-auth
      changed_when: false
      failed_when: discovered_pwquality_password_auth_status.rc not in [ 0, 1 ]
      register: discovered_pwquality_password_auth_status

    - name: MEDIUM | AZLX-23-002489 | AUDIT | Amazon Linux 2023 must ensure the password complexity module is enabled in the password-auth file.
      when: discovered_pwquality_password_auth_status.stdout | length == 0
      ansible.builtin.lineinfile:
        path: /etc/pam.d/password-auth
        regexp: '^(password\s+)(required|requisite)(\s+pam_pwquality.so.*)\sretry=\d(.*)'
        line: '"\1required\3 retry={{ az2023stig_pam_retry }}\4"'
        insertafter: '^password'
        backrefs: true

