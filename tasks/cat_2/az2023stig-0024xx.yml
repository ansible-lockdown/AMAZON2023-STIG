---

- name: MEDIUM | AZLX-23-002400 | PATCH | Amazon Linux 2023 must enforce 24 hours/1 day as the minimum password lifetime.
  when: az2023stig_002400
  tags:
    - azlx-23-002400
    - CAT2
    - SV-274143r1120417_rule
    - V-274143
    - SRG-OS-000075-GPOS-00043
    - NIST800-53R4_NA
    - login
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: ^PASS_MIN_DAYS (-\d|0)
    line: PASS_MIN_DAYS {{ az2023stig_min_days_login }}

- name: MEDIUM | AZLX-23-002405 | PATCH | Amazon Linux 2023 must enforce a delay of at least four seconds between logon prompts following a failed logon attempt.
  when: az2023stig_002405
  tags:
    - azlx-23-002405
    - CAT2
    - SV-274144r1120420_rule
    - V-274144
    - SRG-OS-000480-GPOS-00226
    - CCI-000366
    - NIST800-53R4_CM-6
    - login
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: ^FAIL_DELAY (-\d|[0-3])
    line: FAIL_DELAY {{ az2023stig_fail_delay_login }}

- name: MEDIUM | AZLX-23-002410 | PATCH | Amazon Linux 2023 must define default permissions for all authenticated users in such a way that the user can only read and modify their own files.
  when: az2023stig_002410
  tags:
    - azlx-23-002410
    - CAT2
    - SV-274145r1120423_rule
    - V-274145
    - SRG-OS-000480-GPOS-00228
    - SRG-OS-000480-GPOS-00230
    - CCI-000366
    - NIST800-53R4_CM-6
    - login
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: ^UMASK (?!{{ az2023stig_umask_login }})
    line: UMASK {{ az2023stig_umask_login }}

- name: MEDIUM | AZLX-23-002415 | AUDIT | Amazon Linux 2023 must automatically remove or disable temporary user accounts after 72 hours.
  when: az2023stig_002415
  tags:
    - azlx-23-002415
    - CAT2
    - SV-274146r1120426_rule
    - V-274146
    - SRG-OS-000002-GPOS-00002
    - CCI-000016
    - NIST800-53R4_AC-2
    - login
  vars:
    warn_control_id: "MEDIUM | AZLX-23-002415"
  block:
    - name: MEDIUM | AZLX-23-002415 | AUDIT | Amazon Linux 2023 must automatically remove or disable temporary user accounts after 72 hours.
      ansible.builtin.debug:
        msg: "WARNING!! - Please check for any temporary account ensure they are still valid"

    - name: MEDIUM | AZLX-23-002415 | AUDIT | Amazon Linux 2023 must automatically remove or disable temporary user accounts after 72 hours.
      ansible.builtin.import_tasks:
        file: warning_facts.yml

- name: MEDIUM | AZLX-23-002420 | PATCH | Amazon Linux 2023 must automatically lock an account when three unsuccessful logon attempts occur.
  when: az2023stig_002420
  tags:
    - azlx-23-002420
    - CAT2
    - SV-274147r1120429_rule
    - V-274147
    - SRG-OS-000021-GPOS-00005
    - CCI-000044
    - NIST800-53R4_AC-7
    - pam
  block:
    - name: MEDIUM | AZLX-23-002420 | PATCH | Amazon Linux 2023 must automatically lock an account when three unsuccessful logon attempts occur.
      ansible.builtin.lineinfile:
        path: /etc/pam.d/password-auth
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        insertafter: '{{ item.after | default(omit) }}'
        insertbefore: '{{ item.before | default(omit) }}'
      loop:
        - { regexp: '^auth\s+(required|requisite|sufficient)\s+pam_faillock.so\s*preauth', line: 'auth        required      pam_faillock.so preauth dir={{ az2023stig_pam_faillock_dir }} silent audit deny={{ az2023stig_pam_faillock_attempts }} even_deny_root fail_interval={{ az2023stig_pam_faillock_interval }} unlock_time={{ az2023stig_pam_faillock_unlock_time }}', before: '^auth.*pam_unix.so' }
        - { regexp: '^auth\s+(required|requisite|sufficient)\s+pam_faillock.so\s*authfail .*unlock_time=.*', line: 'auth        required      pam_faillock.so authfail dir={{ az2023stig_pam_faillock_dir }} unlock_time={{ az2023stig_pam_faillock_unlock_time }}', before: '^auth.*pam_deny.so' }
        - { regexp: '^account\s+(required|requisite|sufficient)\s+pam_faillock.so', line: 'account     required      pam_faillock.so', before: '^account.*pam_unix.so' }
      notify: Reboot required

    - name: MEDIUM | AZLX-23-002420 | PATCH | Amazon Linux 2023 must automatically lock an account when three unsuccessful logon attempts occur.
      ansible.builtin.lineinfile:
        path: /etc/pam.d/system-auth
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        insertafter: '{{ item.after | default(omit) }}'
        insertbefore: '{{ item.before | default(omit) }}'
      loop:
        - { regexp: '^auth\s+(required|requisite|sufficient)\s+pam_faillock.so\s*preauth', line: 'auth        required      pam_faillock.so preauth dir={{ az2023stig_pam_faillock_dir }} silent audit deny={{ az2023stig_pam_faillock_attempts }} even_deny_root fail_interval={{ az2023stig_pam_faillock_interval }} unlock_time={{ az2023stig_pam_faillock_unlock_time }}', before: '^auth.*pam_unix.so' }
        - { regexp: '^auth\s+(required|requisite|sufficient)\s+pam_faillock.so\s*authfail .*unlock_time=.*', line: 'auth        required      pam_faillock.so authfail dir={{ az2023stig_pam_faillock_dir }} unlock_time={{ az2023stig_pam_faillock_unlock_time }}', before: '^auth.*pam_deny.so' }
        - { regexp: '^account\s+(required|requisite|sufficient)\s+pam_faillock.so', line: 'account     required       pam_faillock.so', before: '^account.*pam_unix.so' }
      notify: Reboot required

- name: MEDIUM | AZLX-23-002425 | PATCH | Amazon Linux 2023 must be able to enforce a 60-day maximum password lifetime restriction.
  when: az2023stig_002425
  tags:
    - azlx-23-002425
    - CAT2
    - SV-274148r1120432_rule
    - V-274148
    - SRG-OS-000076-GPOS-00044
    - NIST800-53R4_NA
    - pam
  vars:
    warn_control_id: "MEDIUM | AZLX-23-002425"
  block:
    - name: MEDIUM | AZLX-23-002425 | PATCH | Amazon Linux 2023 must be able to enforce a 60-day maximum password lifetime restriction.
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: ^(#?)PASS_MAX_DAYS
        line: 'PASS_MAX_DAYS {{ az2023stig_pass_max_days }}'
        insertafter: '# Password aging controls'

    - name: MEDIUM | AZLX-23-002425 | AUDIT | Amazon Linux 2023 must be able to enforce a 60-day maximum password lifetime restriction.
      ansible.builtin.shell: "awk -F: '(/^[^:]+:[^!*]/ && ($5>{{ az2023stig_pass_max_days }} || $5 == -1)){print $1}' /etc/shadow"
      changed_when: false
      failed_when: false
      register: discovered_passwd_max_days

    - name: MEDIUM | AZLX-23-002425 | AUDIT | Amazon Linux 2023 must be able to enforce a 60-day maximum password lifetime restriction.
      when:
        - discovered_passwd_max_days.stdout is defined
        - discovered_passwd_max_days.stdout | length > 0
      ansible.builtin.debug:
        msg: "Warning!! Your ansible user found to be not compliant with maxdays - Manual intervention required"

    - name: MEDIUM | AZLX-23-002425 | AUDIT | Amazon Linux 2023 must be able to enforce a 60-day maximum password lifetime restriction.
      when:
        - discovered_passwd_max_days.stdout is defined
        - discovered_passwd_max_days.stdout | length > 0
      ansible.builtin.import_tasks:
        file: warning_facts.yml

- name: MEDIUM | AZLX-23-002430 | PATCH | Amazon Linux 2023 must disable account identifiers (individuals, groups, roles, and devices) after 35 days of inactivity.
