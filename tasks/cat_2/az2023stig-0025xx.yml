- name: MEDIUM | AZLX-23-002555 | PATCH | Amazon Linux 2023 debug-shell systemd service must be disabled.
  when: az2023stig_002555
  tags:
    - azlx-23-002555
    - CAT2
    - SV-274173r1120507_rule
    - V-274173
    - SRG-OS-000324-GPOS-00125
    - CCI-002235
    - NIST800-53R4_AC-6
    - systemd
  ansible.builtin.systemd:
    name: debug-shell.service
    enabled: false
    masked: true
    state: stopped
  notify: Systemd daemon reload

- name: MEDIUM | AZLX-23-002560 | PATCH | Amazon Linux 2023 chrony must be configured with a maximum interval of 24 hours between requests sent to a USNO server or a time server designated for the appropriate DOD network.
  when: az2023stig_002560
  tags:
    - azlx-23-002560
    - CAT2
    - SV-274174r1120510_rule
    - V-274174
    - SRG-OS-000355-GPOS-00143
    - NIST800-53R4_NA
    - chrony
  ansible.builtin.template:
    src: etc/chrony.conf.j2
    dest: /etc/chrony.conf
    mode: 'u-x,go-wx'
    owner: root
    group: root
  notify: Restart chrony

