- name: MEDIUM | AZLX-23-002570 | PATCH | Amazon Linux 2023 must routinely check the baseline configuration for unauthorized changes and notify the system administrator when anomalies in the operation of any security functions are discovered.
  when: az2023stig_002570
  tags:
    - azlx-23-002570
    - CAT2
    - SV-274176r1120655_rule
    - V-274176
    - SRG-OS-000363-GPOS-00150
    - CCI-001744
    - NIST800-53R4_CM-3
    - aide
  ansible.builtin.cron:
    name: Run AIDE integrity check
    cron_file: "{{ az2023stig_aide_cron_file }}"
    user: root
    minute: "{{ az2023stig_aide_cron_minute | default('0') }}"
    hour: "{{ az2023stig_aide_cron_hour | default('5') }}"
    day: "{{ az2023stig_aide_cron_day | default('*') }}"
    month: "{{ az2023stig_aide_cron_month | default('*') }}"
    job: "{{ az2023stig_aide_cron_job }} {{ az2023stig_aide_send_email }}"

- name: MEDIUM | AZLX-23-002575 | PATCH | Amazon Linux 2023 must prevent the loading of a new kernel for later execution.
  when: az2023stig_002575
  tags:
    - azlx-23-002575
    - CAT2
    - SV-274177r1120519_rule
    - V-274177
    - SRG-OS-000366-GPOS-00153
    - NIST800-53R4_NA
    - sysctl
  ansible.posix.sysctl:
    name: kernel.kexec_load_disabled
    value: 1
    state: present
    reload: "{{ az2023stig_sysctl_reload }}"
    sysctl_set: true
    sysctl_file: "{{ az2023stig_sysctl_file }}"

- name: MEDIUM | AZLX-23-002580 | PATCH | Amazon Linux 2023 must prevent files with the setuid and setgid bit set from being executed on the /boot/efi directory.
  when:
    - az2023stig_002580
    - item.mount == '/boot/efi'
  tags:
    - azlx-23-002580
    - CAT2
    - SV-274178r1120522_rule
    - V-274178
    - SRG-OS-000368-GPOS-00154
    - CCI-001764
    - NIST800-53R4_CM-7
    - mounts
  ansible.posix.mount:
    path: "/boot/efi"
    state: mounted
    src: "{{ item.device }}"
    fstype: "{{ item.fstype }}"
    opts: "defaults,nosuid"
  loop: "{{ ansible_facts.mounts }}"
  notify: Remount /boot/efi

