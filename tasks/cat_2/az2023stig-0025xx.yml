---

- name: MEDIUM | AZLX-23-002500 | PATCH | Amazon Linux 2023 must ensure a sticky bit be set on all public directories.
  when: az2023stig_002500
  tags:
    - azlx-23-002500
    - CAT2
    - SV-274164r1137695_rule
    - V-274164
    - SRG-OS-000138-GPOS-00069
    - CCI-001090
    - NIST800-53R4_SC-4
    - permissions
  block:
    - name: MEDIUM | AZLX-23-002500 | AUDIT | Amazon Linux 2023 must ensure a sticky bit be set on all public directories.
      ansible.builtin.shell: df --local -P | awk {'if (NR!=1) print $6'} | xargs -I '{}' find '{}' -xdev -type d -perm -0002 -a ! -perm -1000 2>/dev/null
      changed_when: false
      failed_when: discovered_public_dirs_stickybit.rc not in [ 0, 1 ]
      register: discovered_public_dirs_stickybit

    - name: MEDIUM | AZLX-23-002500 | PATCH | Amazon Linux 2023 must ensure a sticky bit be set on all public directories.
      when: discovered_public_dirs_stickybit.stdout | length > 0
      ansible.builtin.file:
        path: "{{ item }}"
        mode: +t
      loop: "{{ discovered_public_dirs_stickybit.stdout_lines }}"

- name: MEDIUM | AZLX-23-002505 | PATCH | Amazon Linux 2023 must ensure all world-writable directories be owned by root, sys, bin, or an application user.
  when: az2023stig_002505
  tags:
    - azlx-23-002505
    - CAT2
    - SV-274165r1137695_rule
    - V-274165
    - SRG-OS-000138-GPOS-00069
    - CCI-001090
    - NIST800-53R4_SC-4
    - permissions
  block:
    - name: MEDIUM | AZLX-23-002505 | AUDIT | Amazon Linux 2023 must ensure all world-writable directories be owned by root, sys, bin, or an application user.
      ansible.builtin.shell: find / -xdev -type d -perm -0002 ! -user root ! -uid +999 -exec ls -ld {} +
      changed_when: false
      failed_when: discovered_public_dirs.rc not in [ 0, 1 ]
      register: discovered_public_dirs

    - name: MEDIUM | AZLX-23-002505 | PATCH | Amazon Linux 2023 must ensure all world-writable directories be owned by root, sys, bin, or an application user.
      when: discovered_public_dirs.stdout | length > 0
      ansible.builtin.file:
        path: "{{ item }}"
        owner: root
        group: root
      loop: "{{ discovered_public_dirs.stdout_lines }}"

- name: MEDIUM | AZLX-23-002510 | PATCH | Amazon Linux 2023 must terminate idle user sessions.
  when: az2023stig_002510
  tags:
    - azlx-23-002510
    - CAT2
    - SV-274166r1155170_rule
    - V-274166
    - SRG-OS-000163-GPOS-00072
    - CCI-001133
    - NIST800-53R4_SC-10
    - permissions
  block:
    - name: MEDIUM | AZLX-23-002510 | PATCH | Amazon Linux 2023 must terminate idle user sessions.
      ansible.builtin.shell: grep -E "\bStopIdleSessionSec\s*=\s*\d*" /etc/systemd/logind.conf
      changed_when: false
      failed_when: discovered_logind_conf_stopsessionidle.rc not in [ 0, 1 ]
      register: discovered_logind_conf_stopsessionidle

    - name: MEDIUM | AZLX-23-002510 | PATCH | Amazon Linux 2023 must terminate idle user sessions.
      when: discovered_logind_conf_stopsessionidle.stdout | length == 0
      ansible.builtin.lineinfile:
        path: /etc/systemd/logind.conf
        regexp: ^(#|)StopIdleSessionSec\s*=\s*\d*
        line: "StopIdleSessionSec={{ az2023stig_logind_conf_stopsessionidle }}"
        insertafter: '^#?StopIdleSessionSec'
        backrefs: true
        state: present

- name: MEDIUM | AZLX-23-002515 | PATCH | Amazon Linux 2023 must enable auditing of processes that start prior to the audit daemon.
  when: az2023stig_002515
  tags:
    - azlx-23-002515
    - CAT2
    - SV-274167r1120489_rule
    - V-274167
    - SRG-OS-000037-GPOS-00015
    - SRG-OS-000042-GPOS-00020
    - SRG-OS-000062-GPOS-00031
    - SRG-OS-000392-GPOS-00172
    - SRG-OS-000462-GPOS-00206
    - SRG-OS-000471-GPOS-00215
    - SRG-OS-000473-GPOS-00218
    - SRG-OS-000254-GPOS-00095
    - CCI-000130
    - CCI-000135
    - CCI-000169
    - CCI-000172
    - CCI-001464
    - CCI-002884
    - NIST800-53R4_AU-3
    - NIST800-53R4_AU-12
    - NIST800-53R4_AU-14
    - NIST800-53R4_MA-4
    - auditd
  block:
    - name: MEDIUM | AZLX-23-002515 | PATCH | Amazon Linux 2023 must enable auditing of processes that start prior to the audit daemon.
      ansible.builtin.command: grep "GRUB_CMDLINE_LINUX=" /etc/default/grub
      changed_when: false
      failed_when: discovered_auditd_grub_cmdline_linux.rc not in [ 0, 1 ]
      register: discovered_auditd_grub_cmdline_linux

    - name: MEDIUM | AZLX-23-002515 | PATCH | Amazon Linux 2023 must enable auditing of processes that start prior to the audit daemon.
      when: discovered_auditd_grub_cmdline_linux.stdout | length == 0
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX='
        line: 'GRUB_CMDLINE_LINUX="{{ discovered_auditd_grub_cmdline_linux.stdout }} audit=1"'
        insertafter: '^GRUB_CMDLINE_LINUX='
        state: present
      notify: Update grub

- name: MEDIUM | AZLX-23-002520 | PATCH | Amazon Linux 2023 must allocate an audit_backlog_limit of sufficient size to capture processes that start prior to the audit daemon.
  when: az2023stig_002520
  tags:
    - azlx-23-002520
    - CAT2
    - SV-274168r1120492_rule
    - V-274168
    - SRG-OS-000254-GPOS-00095
    - SRG-OS-000341-GPOS-00132
    - CCI-001464
    - CCI-001849
    - NIST800-53R4_AU-4
    - NIST800-53R4_AU-14
    - auditd
    - grub
  block:
    - name: MEDIUM | AZLX-23-002520 | PATCH | Amazon Linux 2023 must allocate an audit_backlog_limit of sufficient size to capture processes that start prior to the audit daemon.
      ansible.builtin.command: grep "GRUB_CMDLINE_LINUX=" /etc/default/grub
      changed_when: false
      failed_when: discovered_auditd_grub_cmdline_linux.rc not in [ 0, 1 ]
      register: discovered_auditd_grub_cmdline_linux

    - name: MEDIUM | AZLX-23-002520 | PATCH | Amazon Linux 2023 must allocate an audit_backlog_limit of sufficient size to capture processes that start prior to the audit daemon.
      when: discovered_auditd_grub_cmdline_linux.stdout | length == 0
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX='
        line: 'GRUB_CMDLINE_LINUX="{{ discovered_auditd_grub_cmdline_linux.stdout }} audit_backlog_limit={{ az2023stig_audit_backlog_limit }}"'
        insertafter: '^GRUB_CMDLINE_LINUX='
        state: present
      notify: Update grub

- name: MEDIUM | AZLX-23-002535 | PATCH | Amazon Linux 2023 must enable discretionary access control on hardlinks.
  when: az2023stig_002535
  tags:
    - azlx-23-002535
    - CAT2
    - SV-274169r1120495_rule
    - V-274169
    - SRG-OS-000312-GPOS-00123
    - SRG-OS-000324-GPOS-00125
    - CCI-002165
    - CCI-002235
    - NIST800-53R4_AC-3
    - NIST800-53R4_AC-6
    - sysctl
  ansible.posix.sysctl:
    name: fs.protected_hardlinks
    value: 1
    state: present
    reload: "{{ az2023stig_sysctl_reload }}"
    sysctl_set: true
    sysctl_file: "{{ az2023stig_sysctl_file }}"

- name: MEDIUM | AZLX-23-002540 | PATCH | Amazon Linux 2023 must enable discretionary access control on symlinks.
