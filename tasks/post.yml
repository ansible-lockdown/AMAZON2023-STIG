---

- name: POST | AUDIT | Gather FIPS STATUS
  when: fips_required
  ansible.builtin.command: update-crypto-policies --show
  changed_when: false
  failed_when: discovered_fips_status.rc not in [ 0, 1 ]
  register: discovered_fips_status

- name: Set FIPS
  when: not discovered_fips_status.stdout == 'FIPS'
  ansible.builtin.command: fips-mode-setup --enable
  changed_when: true
  notify: Reboot required

- name: Run auditd logic
  when:
    - update_audit_template
    - az2023stig_auditd_required
  tags: always
  ansible.builtin.import_tasks:
    file: auditd.yml

- name: Flush handlers
  tags: always
  ansible.builtin.meta: flush_handlers

- name: Reboot system if changes require it and not skipped
  block:
    - name: POST | Reboot system if changes require it and not skipped
      when: not skip_reboot
      ansible.builtin.reboot:

    - name: POST | Warning a reboot required but skip option set
      when: skip_reboot
      ansible.builtin.debug:
        msg: "Warning!! changes have been made that require a reboot to be implemented but skip reboot was set - Can affect compliance check results"
      changed_when: true

    - name: "POST | Warning a reboot required but skip option set | warning count"
      when: skip_reboot
      vars:
        warn_control_id: Reboot_required
      ansible.builtin.import_tasks:
        file: warning_facts.yml
