# 002000 Banner
## Banner
az2023stig_logon_banner: |
    "You are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized use only.

    By using this IS (which includes any device attached to this IS), you consent to the following conditions:

    -The USG routinely intercepts and monitors communications on this IS for purposes including, but not limited to, penetration testing, COMSEC monitoring, network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations.

    -At any time, the USG may inspect and seize data stored on this IS.

    -Communications using, or data stored on, this IS are not private, are subject to routine monitoring, interception, and search, and may be disclosed or used for any USG-authorized purpose.

    -This IS includes security measures (e.g., authentication and access controls) to protect USG interests -- not for your personal benefit or privacy.

    -Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI investigative searching or monitoring of the content of privileged communications, or work product, related to personal representation or services by attorneys, psychotherapists, or clergy, and their assistants. Such communications and work product are private and confidential. See User Agreement for details."

# AuditD
# Ability to easily turn off auditd updates to file
az2023stig_auditd_required: true

# Mount points to exclude from privileged command audit searches
az2023stig_priv_command_excluded_mounts: []

# 002015
az2023stig_audit_log_filesystem: /var/log/audit

# 002025 - How to use the name format in audit logs
# must be one of "hostname", "fqd", "numeric"
az2023stig_auditd_name_format: hostname

# 002030 - system action when event queue is full
# must be one of "syslog", "single", "halt"
az2023stig_auditd_overflow_action: syslog

# 002035 - auditd storage space left
az2023stig_auditd_space_left: 25%

# 002040 - system action when auditd storage hits 75% full
az2023stig_auditd_space_left_action: email

# 002045 - when auditd storage hits 95% full
# Must be a percentage value of 5% currently no other options are supported by STIG
az2023stig_auditd_admin_space_left: 5%

# 002050 - when auditd storage hits 95% full
# The supported mode is single currently no other options are supported by STIG
az2023stig_auditd_admin_space_left_action: single

# 002055 & 0020215 - Who to mail when audit process failure
az2023stig_auditd_action_mail_acct: root

# 002220
# Setting for action if audit storage becomes full
# Must be one of "SYSLOG", "SINGLE", "HALT" currently no other options are supported by STIG
az2023stig_auditd_disk_full_action: SYSLOG

# 002260 - auditd log format
# The expected format is "ENRICHED" currently no other options are supported by STIG
az2023stig_audit_conf_log_format: ENRICHED

# 002265 - auditd log group
az2023stig_audit_conf_log_group: root

az2023stig_audit_tools:
  - /sbin/auditctl
  - /sbin/aureport
  - /sbin/ausearch
  - /sbin/autrace
  - /sbin/auditd
  - /sbin/augenrules
  - /sbin/rsyslogd

# 0020065/70/75 rsyslog
# Please amend to custom location as required - defaults to /etc/rsyslog.conf
# az2023stig_rsyslog_offload_conf_file: /etc/rsyslog.d/offload_settings.conf

# 0023xx pwquality variables
az2023stig_pwquality_ucredit: -1
az2023stig_pwquality_lcredit: -1
az2023stig_pwquality_dcredit: -1
az2023stig_pwquality_difok: 8
az2023stig_pwquality_dictcheck: 1
az2023stig_pwquality_minlen: 15
az2023stig_pwquality_ocredit: -1

# 002395 maxlogins
# Must be 10 or less
az2023stig_maxlogins: 10

# 0024xx Password setting
# Must be 1 or more
az2023stig_min_days_login: 1
# Minimum seconds before login prompts must be 4 or greater
az2023stig_fail_delay_login: 4
# umask 077 of more restrictive
az2023stig_umask_login: '077'
# 0024025 Maximum password lifetime before expiry 60
az2023stig_pass_max_days: 60
# 002430 max days for inactive account before locked
az2023stig_pass_inactive_days: 30

# 002445 selinux
az2023stig_selinux_policy: targeted
az2023stig_selinux_mode: enforcing

## 002489
# PAM password quality retry count
az2023stig_pam_retry: 3

## 002490
# Must be 10000 or greater
az2023stig_pam_rounds: 10000

# 002510
az2023stig_logind_conf_stopsessionidle: 600
# 002520
az2023stig_audit_backlog_limit: 8192

# 002535
az2023stig_sysctl_reload: true
az2023stig_sysctl_file: /etc/sysctl.d/99_stig_kernel.conf

# 002560
# Ensure to update the chrony sever with your DOD timesource
az2023stig_chrony_server: 'tick.usno.navy.mil'
az2023stig_chrony_server_options: 'iburst maxpoll 16'

# 0026xx autofs variables
az2023stig_autofs_required: false

# # 002465, 002470,0026xx pam_faillock variables
az2023stig_pam_faillock_dir: /var/log/faillock
az2023stig_pam_faillock_attempts: 3
az2023stig_pam_faillock_fail_for_root: true
az2023stig_pam_faillock_interval: 900
az2023stig_pam_faillock_unlock_time: 0

# 002080 syslog journal-upload variables
az2023stig_syslog_remote_log_server: syslog+tcp://127.0.0.1:514
az2023stig_syslog_serverkeyfile: /etc/ssl/private/syslog.pem
az2023stig_syslog_servercertificatefile: /etc/ssl/certs/syslog.pem
az2023stig_syslog_trustedcertificatefile: /etc/ssl/ca/trusted.pem
